<!DOCTYPE html>
<!-- ROV Solution 主視覺試作：上半實景、下半由載具提煉的抽象符號。以 Playwright 截成 3:4 海報。 -->
<html lang="zh-Hant"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: #d9d6cf; }
  .poster { position: relative; width: 1500px; height: 2000px; background: #efebe2; overflow: hidden;
    font-family: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace; color: #0b1a26; }
  .photo { position: absolute; inset: 0 0 50% 0; background: url(photo.png) 62% 50% / cover no-repeat;
    filter: saturate(.82) contrast(1.06) brightness(.97); }
  .photo::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(8, 20, 30, .18), rgba(8, 20, 30, 0) 40%, rgba(239, 235, 226, .1)); }
  .symbol { position: absolute; inset: 50% 0 0 0; }
  .grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .5; }
  .tag { position: absolute; font-size: 15px; letter-spacing: .14em; }
</style></head>
<body><div class="poster">
  <div class="photo"></div>
  <div class="symbol">
    <svg viewBox="0 0 1500 1000" width="1500" height="1000" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
          <path d="M50 0H0V50" fill="none" stroke="#0b1a26" stroke-width=".5" opacity=".13"/>
        </pattern>
        <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7"/>
          <feDisplacementMap in="SourceGraphic" scale="3.2"/></filter>
      </defs>
      <rect x="150" y="100" width="1200" height="800" fill="url(#grid)"/>
      <!-- 印刷錯位：橘色版微偏 -->
      <g transform="translate(9 -6)" fill="none" stroke="#ff7a2f" stroke-width="5" opacity=".9" filter="url(#rough)">
        <rect x="600" y="330" width="300" height="340" rx="96"/>
      </g>
      <g filter="url(#rough)" fill="none" stroke="#0b1a26" stroke-linecap="round">
        <!-- 機身模組 -->
        <rect x="600" y="330" width="300" height="340" rx="96" stroke-width="5"/>
        <!-- 相機罩：半圓 -->
        <path d="M690 330a60 60 0 0 1 120 0" stroke-width="3"/>
        <!-- 四具向量推進器：45° 短軸 -->
        <g stroke-width="3">
          <circle cx="560" cy="350" r="44"/><path d="M529 381l62-62"/>
          <circle cx="940" cy="350" r="44"/><path d="M971 381l-62-62"/>
          <circle cx="560" cy="650" r="44"/><path d="M529 619l62 62"/>
          <circle cx="940" cy="650" r="44"/><path d="M971 619l-62 62"/>
        </g>
        <!-- 兩具垂直推進器：同心圓 -->
        <g stroke-width="2"><circle cx="680" cy="500" r="30"/><circle cx="680" cy="500" r="9"/>
          <circle cx="820" cy="500" r="30"/><circle cx="820" cy="500" r="9"/></g>
        <!-- 臍帶纜：一條圓弧軌跡 -->
        <path d="M750 670C750 820 980 760 1100 860S1290 900 1340 820" stroke-width="2"/>
        <!-- 下潛軸與深度刻度 -->
        <path d="M300 180V820" stroke-width="1.5"/>
        <g stroke-width="1.5"><path d="M300 180h22M300 340h14M300 500h30M300 660h14M300 820h22"/></g>
      </g>
      <!-- 功能色編碼 -->
      <circle cx="300" cy="500" r="9" fill="#ff7a2f"/>
      <circle cx="1340" cy="820" r="7" fill="#0f7f86"/>
      <rect x="742" y="252" width="16" height="16" fill="#0f7f86"/>
      <path d="M750 270V330" stroke="#0b1a26" stroke-width="1.5"/>
      <!-- 索引標註 -->
      <g font-size="15" letter-spacing="2.2" fill="#0b1a26">
        <text x="345" y="505">Z / 12.0 M</text>
        <text x="614" y="290">01</text><text x="972" y="290">02</text>
        <text x="614" y="738">03</text><text x="972" y="738">04</text>
        <text x="772" y="262">CAM · 70°</text>
        <text x="1130" y="800">TETHER ⟶ 40 M</text>
        <text x="150" y="80">YX — MODEL R</text>
        <text x="1228" y="80">BLOCK 1</text>
        <text x="150" y="945">ROV SOLUTION</text>
        <text x="1026" y="945">6 THRUSTERS · 1 OPERATOR</text>
      </g>
    </svg>
  </div>
  <svg class="grain" width="1500" height="2000"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9"
    numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0"/></filter>
    <rect width="1500" height="2000" filter="url(#n)"/></svg>
</div></body></html>
