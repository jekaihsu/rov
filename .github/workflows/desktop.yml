name: Desktop Windows
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
        working-directory: simulator/desktop
      - run: npm run vendor
        working-directory: simulator/desktop
      - run: python -m pip install numpy==1.24.4 numba==0.57.1 llvmlite==0.40.1 websockets==15.0.1 pyinstaller==6.22.3
      - run: python simulator/desktop/build_backend.py
      - run: python simulator/desktop/smoke_backend.py
      - run: npm run make
        working-directory: simulator/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows-internal-training
          path: simulator/desktop/out/make/**/*.zip
          if-no-files-found: error
      - name: Generate private upload descriptors
        if: github.event_name == 'workflow_dispatch'
        env:
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
          STEAM_DEPOT_ID: ${{ secrets.STEAM_DEPOT_ID }}
        run: node simulator/desktop/steam/generate_vdf.cjs
