# Manual Windows build only (workflow_dispatch). Never on pull_request or push — AGENTS.md CI budget.
# Artifact name follows ROV_BUILD_EDITION: rov-windows-internal or rov-windows-steam.
name: Windows desktop
on:
  workflow_dispatch:
    inputs:
      edition:
        description: Build edition (internal training or steam packaging settings)
        required: true
        default: internal
        type: choice
        options:
          - internal
          - steam
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    concurrency:
      group: desktop-windows-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ROV_BUILD_EDITION: ${{ github.event.inputs.edition || 'internal' }}
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.runtime/numba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simulator/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: simulator/requirements*.txt
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUMBA_CACHE_DIR }}
          key: numba-${{ runner.os }}-${{ runner.arch }}-py311-${{ hashFiles('simulator/requirements*.txt', 'simulator/qysim/**/*.py') }}
          restore-keys: numba-${{ runner.os }}-${{ runner.arch }}-py311-
      - run: npm ci
        working-directory: simulator/desktop
      - run: node test_desktop.cjs
        working-directory: simulator/desktop
      - run: node test_steam.cjs
        working-directory: simulator/desktop
      - run: npm run vendor
        working-directory: simulator/desktop
      - run: python -m pip install -r simulator/requirements-desktop.txt
      - run: python simulator/desktop/build_backend.py
      - name: Frozen backend smoke
        shell: pwsh
        run: |
          python simulator/desktop/smoke_backend.py
          if ($LASTEXITCODE -ne 0) {
            Get-Content .runtime/desktop-backend-smoke.log
            exit 1
          }
      - run: npm run make -- --platform=win32 --arch=x64
        working-directory: simulator/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: rov-windows-${{ env.ROV_BUILD_EDITION }}
          path: simulator/desktop/out/make/**/*.zip
          if-no-files-found: error
      - name: Generate upload descriptors (manual, secrets required)
        if: github.event_name == 'workflow_dispatch'
        env:
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
          STEAM_DEPOT_ID: ${{ secrets.STEAM_DEPOT_ID }}
        run: node simulator/desktop/steam/generate_vdf.cjs
