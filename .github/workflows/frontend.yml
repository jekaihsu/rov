name: Frontend
# Free-plan budget: run only on ready (non-draft) PRs that touch viewer/desktop code.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "simulator/viewer/**"
      - "simulator/desktop/**"
      - "simulator/tests/**.mjs"
      - "docs/showcase/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check viewer and desktop sources
        run: |
          set -e
          for f in $(find simulator/viewer -name '*.js' -not -path '*/vendor/*') simulator/desktop/*.cjs; do
            node --check "$f"
          done
      - name: Node tests
        run: |
          set -e
          node --test simulator/tests/*.mjs
          node simulator/desktop/test_collection_store.cjs
      - name: Generated showcase is not edited by hand
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only FETCH_HEAD HEAD | grep -q '^docs/showcase/'; then
            echo "docs/showcase is generated by simulator/tools/build_showcase.py; do not edit it in feature PRs." >&2
            exit 1
          fi
