name: Backend
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NUMBA_CACHE_DIR: ${{ github.workspace }}/.runtime/numba
jobs:
  backend:
    concurrency:
      group: backend-backend-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event.action == 'ready_for_review') && 20 || 5 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: simulator/requirements*.txt
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUMBA_CACHE_DIR }}
          key: numba-${{ runner.os }}-${{ runner.arch }}-py311-${{ hashFiles('simulator/requirements*.txt', 'simulator/qysim/**/*.py') }}
          restore-keys: numba-${{ runner.os }}-${{ runner.arch }}-py311-
      - run: python -m pip install -r simulator/requirements.txt numba
      - name: Run selected tier
        env:
          TIER: ${{ (github.event_name == 'workflow_dispatch' || github.event.action == 'ready_for_review') && 'full' || 'quick' }}
        run: python tools/run_checks.py --kind unit --tier "$TIER"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-logs
          path: simulator/output/checks/
