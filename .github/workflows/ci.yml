name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: simulator/requirements.txt
      - run: pip install -r simulator/requirements.txt
      - name: Unit tests
        working-directory: simulator
        run: python -m unittest discover -s tests
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check viewer and desktop sources
        run: |
          set -e
          for f in simulator/viewer/*.js $(find simulator/viewer -mindepth 2 -name '*.js' -not -path '*/vendor/*') simulator/desktop/*.cjs; do
            node --check "$f"
          done
      - name: Node tests
        run: |
          set -e
          node --test simulator/tests/*.mjs
          node simulator/desktop/test_collection_store.cjs
          node simulator/desktop/test_steam.cjs
      - name: Generated showcase is not edited by hand
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only FETCH_HEAD HEAD | grep -q '^docs/showcase/'; then
            echo "docs/showcase is generated by simulator/tools/build_showcase.py; do not edit it in feature PRs." >&2
            exit 1
          fi
