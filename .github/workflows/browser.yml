name: Browser
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "simulator/viewer/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NUMBA_CACHE_DIR: ${{ github.workspace }}/.runtime/numba
jobs:
  browser:
    concurrency:
      group: browser-browser-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event.action == 'ready_for_review') && 60 || 5 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: simulator/requirements*.txt
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUMBA_CACHE_DIR }}
          key: numba-${{ runner.os }}-${{ runner.arch }}-py311-${{ hashFiles('simulator/requirements*.txt', 'simulator/qysim/**/*.py') }}
          restore-keys: numba-${{ runner.os }}-${{ runner.arch }}-py311-
      - run: python -m pip install -r simulator/requirements.txt numba playwright
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m playwright install --with-deps chromium
      - run: node simulator/desktop/test_collection_store.cjs
      # Full tier stays advisory as before H4: browser_expedition_smoke and browser_paint_smoke
      # time out under software rendering on main (docs/ci/timings.md). Quick (HUD) is a gate.
      - name: Run selected tier
        id: checks
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' || github.event.action == 'ready_for_review' }}
        env:
          TIER: ${{ (github.event_name == 'workflow_dispatch' || github.event.action == 'ready_for_review') && 'full' || 'quick' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            args+=(--changed --base "$BASE_SHA")
          fi
          python simulator/tools/run_browser_checks.py --tier "$TIER" "${args[@]}"
      - name: Report advisory result
        if: steps.checks.outcome == 'failure'
        run: |
          echo "::warning::Advisory full browser tier failed; inspect browser-logs."
          echo "Full browser tier failed (advisory); see browser-logs artifact." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure() || steps.checks.outcome == 'failure'
        with:
          name: browser-logs
          path: simulator/output/browser-checks/
