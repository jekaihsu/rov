<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Falcon · ROV 3D 機庫</title>
<style>*{box-sizing:border-box}body{margin:0;background:#09141c;color:#e1edf1;font:14px system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh}aside{position:absolute;top:32px;left:32px;width:270px;pointer-events:none}aside>*{pointer-events:auto}small{color:#809ba8;letter-spacing:.18em}h1{font-size:38px;margin:8px 0}p{color:#9db0ba;line-height:1.7}button,a{background:#142630;border:1px solid #354752;border-radius:4px;color:#e4edf0;padding:9px 12px;text-decoration:none;cursor:pointer}button.active{border-color:#f0ca62;color:#f0ca62}.models{display:flex;gap:6px;flex-wrap:wrap}label{display:block;margin-top:14px;font-size:12px;color:#acbfc9}input{display:block;width:240px;accent-color:#eac15e}footer{position:absolute;bottom:24px;left:32px;color:#809ba8;font-size:12px}#status{color:#f0ca62}#arm{margin-top:22px}#arm[hidden]{display:none}@media(max-width:650px){aside{top:16px;left:16px;width:210px}h1{font-size:26px}input{width:180px}footer{left:16px;bottom:12px}}</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script></head>
<body><aside><small>ROV SIMULATOR / MODEL HANGAR</small><h1 id="name">Falcon</h1><p>拖曳旋轉 · 滾輪縮放<br>右鍵拖曳平移</p><div class="models"><button data-model="x1">X1</button><button data-model="bluerov2_heavy">BlueROV2 Heavy</button><button data-model="falcon" class="active">Falcon</button></div><p id="status">載入模型…</p><div id="arm"><small>機械臂預覽</small><label>底座<input id="j0" type="range" min="-95" max="95" value="-18"></label><label>肩部<input id="j1" type="range" min="-65" max="75" value="-20"></label><label>肘部<input id="j2" type="range" min="-120" max="120" value="45"></label><label>腕部<input id="j3" type="range" min="-100" max="100" value="-25"></label><label>夾爪開合<input id="grip" type="range" min="0" max="1" step="0.01" value="0.6"></label></div></aside><footer>依參考資料重建的無標誌模型 · 機庫預覽不運行水下物理</footer>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{createVehicleModel}from'./vehicle_models.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#09141c');scene.add(new THREE.HemisphereLight(0xe2efff,0x283039,1.4));
for(const [color,intensity,pos]of [[0xffffff,2,[2,4,3]],[0xb6d6ee,1,[-3,1,2]],[0xffffff,.8,[0,2,-3]]]){const l=new THREE.DirectionalLight(color,intensity);l.position.set(...pos);scene.add(l);}
const grid=new THREE.GridHelper(12,40,0x355363,0x142c38);grid.position.y=-.53;scene.add(grid);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,100);camera.position.set(-1.8,1.0,2.2);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=.5;controls.maxDistance=8;controls.target.set(-.23,0,.2);
let model=null,generation=0;const names={x1:'X1',bluerov2_heavy:'BlueROV2 Heavy',falcon:'Falcon'};
const views=document.createElement('div');views.className='models';views.style.marginTop='14px';
for(const [label,position]of [['斜前',[-1.8,1,2.2]],['正面',[0,-.05,2.8]],['側面',[-2.8,-.05,.2]]]){const button=document.createElement('button');button.textContent=label;button.onclick=()=>{camera.position.set(...position);controls.target.set(0,-.08,.2);controls.update();};views.append(button);}
document.getElementById('status').after(views);
const reference=document.createElement('p');reference.innerHTML='<a href="https://www.saabseaeye.com/solutions/underwater-vehicles/falcon" target="_blank" rel="noopener">Falcon 原廠參考 ↗</a>';views.after(reference);
[0,-15,30,-15].forEach((value,i)=>document.getElementById('j'+i).value=value);
async function select(id){const ticket=++generation;document.getElementById('status').textContent='載入模型…';const next=await createVehicleModel(id);if(ticket!==generation){next.dispose();return;}model?.dispose();model=next;scene.add(model.root);document.getElementById('name').textContent=names[id];document.title=names[id]+' · ROV 3D 機庫';document.getElementById('status').textContent=next.loadError?'模型載入失敗，顯示備用外形':'模型已載入';document.getElementById('arm').hidden=id!=='falcon';document.querySelectorAll('[data-model]').forEach(b=>b.classList.toggle('active',b.dataset.model===id));window.__modelPreview={model,scene,camera,renderer};}
document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>select(b.dataset.model));select(new URLSearchParams(location.search).get('model')||'falcon');
function frame(){requestAnimationFrame(frame);controls.update();model?.updateArm({joints:[0,1,2,3].map(i=>+document.getElementById('j'+i).value),grip:+document.getElementById('grip').value});renderer.render(scene,camera);}frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
