<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>動畫模組測試</title>
<style>
  html,body{margin:0;height:100%;background:#061018;color:#cfe;font:13px sans-serif;overflow:hidden}
  #main{position:absolute;inset:0}
  #pip{position:absolute;right:14px;bottom:14px;width:360px;height:230px;border:1px solid #2b4a5c;border-radius:6px;overflow:hidden;background:#000}
  #cap{position:absolute;left:14px;top:12px;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:4px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="main"></div><div id="pip"></div><div id="cap">下水動畫 / 操作員子畫面 測試（?manual=1 由測試程式逐格推進）</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DeployIntro } from './deploy_intro.js';
import { PilotPiP } from './pilot_pip.js';

const manual = new URLSearchParams(location.search).has('manual');
const host = document.getElementById('main');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(host.clientWidth, host.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87aac2);
scene.fog = new THREE.Fog(0x6f97ad, 30, 140);
const camera = new THREE.PerspectiveCamera(55, host.clientWidth / host.clientHeight, 0.05, 500);
scene.add(new THREE.HemisphereLight(0xdff2ff, 0x1c3342, 1.2));
const sun = new THREE.DirectionalLight(0xfff3dc, 2.2); sun.position.set(20, 30, 10); sun.castShadow = true; scene.add(sun);
// sea surface (seen from above and below) + seabed
const sea = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x1b5a78, transparent: true, opacity: 0.82, roughness: 0.25, metalness: 0.1, side: THREE.DoubleSide }));
sea.rotation.x = -Math.PI / 2; scene.add(sea);
const bed = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x4a4636 }));
bed.rotation.x = -Math.PI / 2; bed.position.y = -30; scene.add(bed);

const intro = new DeployIntro(scene, { spool: [-4, 0, 0], start: [0, 0, 3], seabed: 30 });
const pip = new PilotPiP(document.getElementById('pip'), { mirror: renderer.domElement });

const rov = new THREE.Group(); scene.add(rov);
new GLTFLoader().load('rov.glb', (g) => {
  const root = g.scene;
  const box = new THREE.Box3().setFromObject(root); root.position.sub(box.getCenter(new THREE.Vector3()));
  rov.add(root);
  window.__ready = true;
}, undefined, () => { rov.add(new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.4, 0.77), new THREE.MeshStandardMaterial({ color: 0xf2b705 }))); window.__ready = true; });
intro.play(rov, camera, () => { document.getElementById('cap').textContent = '下水完成 → 交給學員操控'; });

let t = 0;
function rcAt(t) {
  const s = Math.sin;
  return { left_ud: 1500 + 400 * s(t * 1.3), left_lr: 1500 + 350 * s(t * 0.9 + 1), right_ud: 1500 + 450 * s(t * 0.7),
           right_lr: 1500 + 300 * s(t * 1.7), left_wave: 1500 + 500 * s(t * 0.5), right_wave: 1500 + 500 * s(t * 0.8 + 2),
           rc_lock: t > 1 ? 0 : 1, keep_depth: t > 3 ? 1 : 0, photo: (t % 4) < 0.3 ? 1 : 0, record: 0 };
}
function stepOnce(dt) {
  t += dt;
  intro.update(dt);
  const under = camera.position.y < 0;
  scene.background.set(under ? 0x0b3346 : 0x87aac2);
  scene.fog.color.set(under ? 0x0b3346 : 0x6f97ad);
  scene.fog.near = under ? 1 : 30; scene.fog.far = under ? 22 : 140;
  renderer.render(scene, camera);
  pip.update(dt, rcAt(t));
}
window.__step = (seconds, fps = 30) => { const n = Math.round(seconds * fps); for (let i = 0; i < n; i++) stepOnce(1 / fps); return t; };
if (!manual) {
  let last = performance.now();
  (function loop(now) { stepOnce(Math.min(0.05, (now - last) / 1000)); last = now; requestAnimationFrame(loop); })(last);
}
</script>
</body></html>
