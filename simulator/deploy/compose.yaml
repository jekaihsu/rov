services:
  simulator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
  web:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      ROV_DOMAIN: ${ROV_DOMAIN:?Set your public hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [simulator]
volumes:
  caddy_data:
  caddy_config:
