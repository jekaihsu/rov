  <!-- ================= key specs ================= -->
  <g transform="translate(1130,700)">
    <text class="th" x="0" y="0">主要参数（目标值）</text>
    <g class="t">
      <text x="0" y="26">外形：约 460 × 340 × 260 mm（长×宽×高）</text>
      <text x="0" y="48">空气中重量：约 10–11 kg，水中调至微正浮力</text>
      <text x="0" y="70">设计深度：65–100 m（亚克力管）/ 首阶段 30 m</text>
      <text x="0" y="92">推进：6 推进器，4 水平矢量 + 2 垂直，5 自由度</text>
      <text x="0" y="114">航速：约 1.5 kn（~0.75 m/s）</text>
      <text x="0" y="136">续航：约 1.5–2 h（常规巡检工况）</text>
      <text x="0" y="158">软件：ArduSub + BlueOS / QGroundControl</text>
    </g>
  </g>

  <!-- ================= title block ================= -->
  <g transform="translate(1130,900)">
    <rect x="0" y="0" width="430" height="190" fill="#fff" stroke="#222" stroke-width="1.4"/>
    <line class="grid" x1="0" y1="50" x2="430" y2="50"/>
    <line class="grid" x1="0" y1="90" x2="430" y2="90"/>
