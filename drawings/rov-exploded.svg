<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="1600" height="1130" font-family="'Noto Sans CJK SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <title>ROV-01 爆炸图（侧视）</title>
  <defs>
    <style>
      .sheet { fill: #fbfbf8; }
      .frame { fill: none; stroke: #222; stroke-width: 2; }
      .part { fill: #e6edf2; stroke: #1d2327; stroke-width: 1.6; }
      .dark { fill: #4a545c; stroke: #1d2327; stroke-width: 1.4; }
      .acrylic { fill: #d6ecfa; fill-opacity: .55; stroke: #1d5a80; stroke-width: 1.6; }
      .hdpe { fill: #2f3a42; stroke: #11181c; stroke-width: 1.6; }
      .foam { fill: #f4c542; stroke: #8a6a00; stroke-width: 1.6; }
      .board { fill: #2e7d4f; stroke: #174a2d; stroke-width: 1.2; }
      .batt { fill: #6b8fb3; stroke: #274a6b; stroke-width: 1.2; }
      .brass { fill: #c9a24a; stroke: #6d5313; stroke-width: 1.2; }
      .expl { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 10 4 2 4; fill: none; }
      .hid { stroke: #333; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
      .lead { stroke: #333; stroke-width: 1; fill: none; }
      .ball { fill: #fff; stroke: #222; stroke-width: 1.3; }
      .bn { font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: #111; }
      .t { font-size: 13px; fill: #1a1a1a; }
      .ts { font-size: 11px; fill: #444; }
      .th { font-size: 14px; font-weight: 700; fill: #111; }
      .title { font-size: 22px; font-weight: 700; fill: #111; }
      .grid { stroke: #999; stroke-width: .8; }
      .arrow { stroke: #c0392b; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/>
    </marker>
    <!-- Thruster, side view, axis horizontal, prop end on the left -->
    <g id="thr">
      <rect x="-36" y="-24" width="56" height="48" rx="7" class="part"/>
      <line x1="-24" y1="-24" x2="-24" y2="24" class="lead"/>
      <line x1="8" y1="-24" x2="8" y2="24" class="lead"/>
      <path d="M20,-13 L42,-9 L42,9 L20,13 Z" class="dark"/>
      <rect x="-10" y="-6" width="36" height="12" rx="3" class="dark"/>
      <rect x="-6" y="24" width="20" height="8" class="hdpe"/>
    </g>
    <g id="balloon"><circle r="13" class="ball"/></g>
  </defs>

  <rect class="sheet" x="0" y="0" width="1600" height="1130"/>
  <rect class="frame" x="16" y="16" width="1568" height="1098"/>
  <rect class="frame" x="24" y="24" width="1552" height="1082" stroke-width="0.8"/>

  <text class="title" x="48" y="66">ROV-01 · 爆炸图（侧视，左 = 船首）</text>
  <text class="ts" x="48" y="88">Exploded view · side elevation · not to scale · 尺寸以 docs/ROV-设计方案.md 为准</text>

  <!-- ================= explosion center lines (drawn first, behind parts) ================= -->
  <line class="expl" x1="350" y1="200" x2="350" y2="360"/>
  <line class="expl" x1="850" y1="200" x2="850" y2="360"/>
  <line class="expl" x1="600" y1="292" x2="600" y2="360"/>
  <line class="expl" x1="232" y1="500" x2="280" y2="500"/>
  <line class="expl" x1="920" y1="500" x2="968" y2="500"/>
  <line class="expl" x1="172" y1="420" x2="280" y2="420"/>
  <line class="expl" x1="150" y1="640" x2="830" y2="640"/>
  <line class="expl" x1="560" y1="740" x2="560" y2="680"/>
  <line class="expl" x1="320" y1="520" x2="320" y2="960"/>
  <line class="expl" x1="880" y1="520" x2="880" y2="960"/>

  <!-- 1 buoyancy foam -->
  <rect class="foam" x="320" y="150" width="560" height="50" rx="8"/>
  <text class="ts" x="600" y="180" text-anchor="middle" fill="#6b5200">R-3318 硬质浮力泡棉（左右各一块）</text>

  <!-- 2 vertical thruster -->
  <g transform="translate(600,250) rotate(-90)"><use href="#thr"/></g>

  <!-- 5 light, front upper -->
  <rect class="part" x="120" y="405" width="50" height="30" rx="4"/>
  <ellipse cx="120" cy="420" rx="6" ry="15" fill="#fff6c9" stroke="#1d2327" stroke-width="1.4"/>
  <line class="lead" x1="132" y1="405" x2="132" y2="435"/>
  <line class="lead" x1="142" y1="405" x2="142" y2="435"/>

  <!-- 4 frame side panel (HDPE) -->
  <path class="hdpe" d="M300,360 H900 Q920,360 920,380 V520 H280 V380 Q280,360 300,360 Z
                        M540,374 H660 Q670,374 670,384 Q670,394 660,394 H540 Q530,394 530,384 Q530,374 540,374 Z
                        M350,420 m-30,0 a30,30 0 1,0 60,0 a30,30 0 1,0 -60,0 Z
                        M850,420 m-30,0 a30,30 0 1,0 60,0 a30,30 0 1,0 -60,0 Z
                        M420,410 H500 V470 H420 Z M700,410 H780 V470 H700 Z" fill-rule="evenodd"/>
  <circle cx="560" cy="440" r="4" fill="#fbfbf8"/><circle cx="640" cy="440" r="4" fill="#fbfbf8"/>
  <circle cx="560" cy="495" r="4" fill="#fbfbf8"/><circle cx="640" cy="495" r="4" fill="#fbfbf8"/>
  <text class="ts" x="600" y="512" text-anchor="middle" fill="#e8eef2">12 mm HDPE 侧板 ×2（CNC）</text>

  <!-- 3 horizontal vectored thrusters (front & rear, 45° in plan view) -->
  <g transform="translate(196,500)"><use href="#thr"/></g>
  <g transform="translate(1004,500) scale(-1,1)"><use href="#thr"/></g>

  <!-- ================= electronics enclosure, exploded along its axis ================= -->
  <!-- 6 dome -->
  <path class="acrylic" d="M250,600 A40,40 0 0,0 250,680 Z"/>
  <rect class="part" x="246" y="600" width="6" height="80"/>
  <!-- 7 front flange + O-rings -->
  <rect class="part" x="280" y="596" width="20" height="88" rx="2"/>
  <rect x="300" y="606" width="14" height="68" class="part"/>
  <line x1="306" y1="606" x2="306" y2="674" stroke="#111" stroke-width="3"/>
  <!-- 8 4" tube -->
  <rect class="acrylic" x="340" y="600" width="380" height="80"/>
  <line class="hid" x1="340" y1="606" x2="720" y2="606"/>
  <line class="hid" x1="340" y1="674" x2="720" y2="674"/>
  <text class="ts" x="530" y="644" text-anchor="middle" fill="#1d5a80">4″ 亚克力管 · 内径 102 mm · 长 300 mm</text>
  <!-- 9 rear end cap + flange -->
  <rect x="746" y="606" width="14" height="68" class="part"/>
  <line x1="754" y1="606" x2="754" y2="674" stroke="#111" stroke-width="3"/>
  <rect class="part" x="760" y="596" width="22" height="88" rx="2"/>
  <!-- 10 penetrators / depth sensor / vent -->
  <rect class="brass" x="782" y="606" width="18" height="9"/>
  <rect class="brass" x="782" y="622" width="18" height="9"/>
  <rect class="brass" x="782" y="638" width="18" height="9"/>
  <rect class="brass" x="782" y="654" width="18" height="9"/>
  <rect class="dark" x="782" y="668" width="14" height="10" rx="2"/>
  <!-- 11 tether -->
  <path d="M800,626 C860,626 880,700 960,700 S1060,660 1090,700" fill="none" stroke="#e67e22" stroke-width="5" stroke-linecap="round"/>
  <path d="M800,626 C860,626 880,700 960,700 S1060,660 1090,700" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="3 5"/>
  <text class="ts" x="1100" y="728" text-anchor="end">脐带缆 → 岸上</text>

  <!-- ================= electronics tray (slides into tube) ================= -->
  <line class="arrow" x1="700" y1="758" x2="742" y2="758"/>
  <text class="ts" x="700" y="790">插入电子舱</text>
  <rect class="part" x="380" y="770" width="310" height="8"/>
  <!-- 12 camera + tilt -->
  <rect class="dark" x="332" y="744" width="28" height="22" rx="3"/>
  <circle cx="332" cy="755" r="7" fill="#1b2a38" stroke="#000"/>
  <rect class="part" x="360" y="748" width="20" height="18"/>
  <!-- 13 Pi + Navigator -->
  <rect class="board" x="395" y="752" width="85" height="18"/>
  <rect class="board" x="400" y="740" width="75" height="12" fill="#1f5fa8" stroke="#123a66"/>
  <!-- 14 ESC ×6 -->
  <g class="board" fill="#7a3fa0" stroke="#3f1f55">
    <rect x="495" y="752" width="12" height="18" fill="#7a3fa0" stroke="#3f1f55"/>
    <rect x="511" y="752" width="12" height="18" fill="#7a3fa0" stroke="#3f1f55"/>
    <rect x="527" y="752" width="12" height="18" fill="#7a3fa0" stroke="#3f1f55"/>
    <rect x="543" y="752" width="12" height="18" fill="#7a3fa0" stroke="#3f1f55"/>
    <rect x="559" y="752" width="12" height="18" fill="#7a3fa0" stroke="#3f1f55"/>
    <rect x="575" y="752" width="12" height="18" fill="#7a3fa0" stroke="#3f1f55"/>
  </g>
  <!-- 15 Fathom-X / power -->
  <rect class="board" x="600" y="750" width="40" height="20" fill="#b03a2e" stroke="#5e1c16"/>
  <rect class="board" x="645" y="754" width="35" height="16" fill="#555" stroke="#222"/>

  <!-- ================= battery enclosure ================= -->
  <rect class="part" x="402" y="826" width="16" height="58" rx="2"/>
  <rect class="acrylic" x="420" y="830" width="260" height="50" fill="#e3e8ec" stroke="#555"/>
  <rect class="part" x="682" y="826" width="16" height="58" rx="2"/>
  <rect class="brass" x="698" y="846" width="14" height="8"/>
  <rect class="batt" x="440" y="840" width="220" height="30" rx="4"/>
  <text x="550" y="860" text-anchor="middle" font-size="11" fill="#fff">4S 14.8 V Li-ion</text>

  <!-- ================= skids + ballast ================= -->
  <rect class="hdpe" x="300" y="960" width="600" height="14" rx="3"/>
  <rect class="dark" x="330" y="976" width="40" height="18"/>
  <rect class="dark" x="380" y="976" width="40" height="18"/>
  <rect class="dark" x="780" y="976" width="40" height="18"/>
  <rect class="dark" x="830" y="976" width="40" height="18"/>

  <!-- ================= balloons + leaders ================= -->
  <g>
    <line class="lead" x1="300" y1="130" x2="330" y2="158"/><use href="#balloon" x="290" y="120"/><text class="bn" x="290" y="120">1</text>
    <line class="lead" x1="668" y1="230" x2="624" y2="246"/><use href="#balloon" x="680" y="226"/><text class="bn" x="680" y="226">2</text>
    <line class="lead" x1="196" y1="453" x2="196" y2="476"/><use href="#balloon" x="196" y="440"/><text class="bn" x="196" y="440">3</text>
    <line class="lead" x1="1004" y1="453" x2="1004" y2="476"/><use href="#balloon" x="1004" y="440"/><text class="bn" x="1004" y="440">3</text>
    <line class="lead" x1="948" y1="384" x2="918" y2="396"/><use href="#balloon" x="960" y="380"/><text class="bn" x="960" y="380">4</text>
    <line class="lead" x1="145" y1="383" x2="145" y2="405"/><use href="#balloon" x="145" y="370"/><text class="bn" x="145" y="370">5</text>
    <line class="lead" x1="226" y1="573" x2="232" y2="608"/><use href="#balloon" x="222" y="560"/><text class="bn" x="222" y="560">6</text>
    <line class="lead" x1="290" y1="573" x2="290" y2="596"/><use href="#balloon" x="290" y="560"/><text class="bn" x="290" y="560">7</text>
    <line class="lead" x1="530" y1="573" x2="530" y2="600"/><use href="#balloon" x="530" y="560"/><text class="bn" x="530" y="560">8</text>
    <line class="lead" x1="771" y1="573" x2="771" y2="596"/><use href="#balloon" x="771" y="560"/><text class="bn" x="771" y="560">9</text>
    <line class="lead" x1="832" y1="590" x2="800" y2="610"/><use href="#balloon" x="842" y="580"/><text class="bn" x="842" y="580">10</text>
    <line class="lead" x1="1090" y1="673" x2="1086" y2="696"/><use href="#balloon" x="1090" y="660"/><text class="bn" x="1090" y="660">11</text>
    <line class="lead" x1="340" y1="725" x2="344" y2="744"/><use href="#balloon" x="336" y="712"/><text class="bn" x="336" y="712">12</text>
    <line class="lead" x1="437" y1="725" x2="437" y2="740"/><use href="#balloon" x="437" y="712"/><text class="bn" x="437" y="712">13</text>
    <line class="lead" x1="541" y1="725" x2="541" y2="752"/><use href="#balloon" x="541" y="712"/><text class="bn" x="541" y="712">14</text>
    <line class="lead" x1="630" y1="725" x2="625" y2="750"/><use href="#balloon" x="630" y="712"/><text class="bn" x="630" y="712">15</text>
    <line class="lead" x1="727" y1="852" x2="698" y2="852"/><use href="#balloon" x="740" y="852"/><text class="bn" x="740" y="852">16</text>
    <line class="lead" x1="550" y1="897" x2="550" y2="870"/><use href="#balloon" x="550" y="910"/><text class="bn" x="550" y="910">17</text>
    <line class="lead" x1="947" y1="965" x2="900" y2="967"/><use href="#balloon" x="960" y="965"/><text class="bn" x="960" y="965">18</text>
    <line class="lead" x1="400" y1="1017" x2="400" y2="994"/><use href="#balloon" x="400" y="1030"/><text class="bn" x="400" y="1030">19</text>
  </g>

  <!-- ================= parts list ================= -->
  <g transform="translate(1130,60)">
    <text class="th" x="0" y="0">零件表 / Parts list</text>
    <rect x="0" y="12" width="430" height="600" fill="#fff" stroke="#222" stroke-width="1.2"/>
    <line class="grid" x1="30" y1="12" x2="30" y2="612"/>
    <line class="grid" x1="200" y1="12" x2="200" y2="612"/>
    <line class="grid" x1="240" y1="12" x2="240" y2="612"/>
    <g class="t">
      <text x="15" y="32" text-anchor="middle" font-weight="700">#</text><text x="38" y="32" font-weight="700">名称</text><text x="220" y="32" text-anchor="middle" font-weight="700">数量</text><text x="248" y="32" font-weight="700">规格 / 建议型号</text>
    </g>
    <line x1="0" y1="42" x2="430" y2="42" stroke="#222"/>
    <g class="t" id="rows">
      <text x="15" y="62" text-anchor="middle">1</text><text x="38" y="62">浮力泡棉</text><text x="220" y="62" text-anchor="middle">2</text><text x="248" y="62">R-3318 / 可替代 PVC 泡棉</text>
      <text x="15" y="92" text-anchor="middle">2</text><text x="38" y="92">垂直推进器</text><text x="220" y="92" text-anchor="middle">2</text><text x="248" y="92">T200 级（正/反桨各 1）</text>
      <text x="15" y="122" text-anchor="middle">3</text><text x="38" y="122">水平矢量推进器</text><text x="220" y="122" text-anchor="middle">4</text><text x="248" y="122">T200 级，俯视 45° 安装</text>
      <text x="15" y="152" text-anchor="middle">4</text><text x="38" y="152">机架侧板 + 横梁</text><text x="220" y="152" text-anchor="middle">1套</text><text x="248" y="152">12 mm HDPE，CNC 切割</text>
      <text x="15" y="182" text-anchor="middle">5</text><text x="38" y="182">LED 照明灯</text><text x="220" y="182" text-anchor="middle">2</text><text x="248" y="182">≥1500 lm，PWM 调光</text>
      <text x="15" y="212" text-anchor="middle">6</text><text x="38" y="212">亚克力半球罩</text><text x="220" y="212" text-anchor="middle">1</text><text x="248" y="212">4″，相机视窗</text>
      <text x="15" y="242" text-anchor="middle">7</text><text x="38" y="242">前法兰 + O 型圈</text><text x="220" y="242" text-anchor="middle">1</text><text x="248" y="242">双道径向密封</text>
      <text x="15" y="272" text-anchor="middle">8</text><text x="38" y="272">电子舱管体</text><text x="220" y="272" text-anchor="middle">1</text><text x="248" y="272">4″ 亚克力，300 mm</text>
      <text x="15" y="302" text-anchor="middle">9</text><text x="38" y="302">后端盖 + 法兰</text><text x="220" y="302" text-anchor="middle">1</text><text x="248" y="302">铝 6061，14 孔</text>
      <text x="15" y="332" text-anchor="middle">10</text><text x="38" y="332">穿线器/深度计/排气阀</text><text x="220" y="332" text-anchor="middle">1套</text><text x="248" y="332">M10 穿线器、Bar30 级</text>
      <text x="15" y="362" text-anchor="middle">11</text><text x="38" y="362">脐带缆</text><text x="220" y="362" text-anchor="middle">1</text><text x="248" y="362">中性浮力双绞线 50–100 m</text>
      <text x="15" y="392" text-anchor="middle">12</text><text x="38" y="392">摄像头 + 俯仰舵机</text><text x="220" y="392" text-anchor="middle">1</text><text x="248" y="392">1080p 低照度 USB</text>
      <text x="15" y="422" text-anchor="middle">13</text><text x="38" y="422">主控</text><text x="220" y="422" text-anchor="middle">1</text><text x="248" y="422">Raspberry Pi + Navigator</text>
      <text x="15" y="452" text-anchor="middle">14</text><text x="38" y="452">电调 ESC</text><text x="220" y="452" text-anchor="middle">6</text><text x="248" y="452">双向 30 A，PWM</text>
      <text x="15" y="482" text-anchor="middle">15</text><text x="38" y="482">通讯板 + 降压模块</text><text x="220" y="482" text-anchor="middle">1套</text><text x="248" y="482">Fathom-X / 5 V 6 A BEC</text>
      <text x="15" y="512" text-anchor="middle">16</text><text x="38" y="512">电池舱</text><text x="220" y="512" text-anchor="middle">1</text><text x="248" y="512">3″ 铝管/亚克力，250 mm</text>
      <text x="15" y="542" text-anchor="middle">17</text><text x="38" y="542">锂电池</text><text x="220" y="542" text-anchor="middle">1</text><text x="248" y="542">4S 14.8 V 15 Ah（~220 Wh）</text>
      <text x="15" y="572" text-anchor="middle">18</text><text x="38" y="572">滑橇</text><text x="220" y="572" text-anchor="middle">2</text><text x="248" y="572">HDPE，兼作搬运把手</text>
      <text x="15" y="602" text-anchor="middle">19</text><text x="38" y="602">配重块</text><text x="220" y="602" text-anchor="middle">4–8</text><text x="248" y="602">200 g 不锈钢/铅，微调姿态</text>
    </g>
